name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm run test:ci

      - name: Install Chromium for the layout audit
        run: npx playwright install --with-deps chromium

      - name: Start the web build
        run: |
          EXPO_OFFLINE=1 npx expo start --web --port 8099 > /tmp/expo-web.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:8099; then
              echo "Dev server up after ${i} attempt(s)"
              exit 0
            fi
            sleep 3
          done
          echo "Dev server never came up:"
          tail -40 /tmp/expo-web.log
          exit 1

      # Catches content escaping or crowding its card, clipped SVG drawings,
      # and horizontal overflow — defects that only exist once rendered.
      - name: Layout audit
        run: npm run audit:layout

      - name: Dev server log on failure
        if: failure()
        run: tail -60 /tmp/expo-web.log || true
