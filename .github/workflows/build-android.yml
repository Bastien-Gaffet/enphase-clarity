name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Prebuild native Android project
        run: npx expo prebuild --platform android --no-install

      # The Gradle wrapper fetches its distribution with a 10-second read
      # timeout and no retry at all, and that host failed twice in a row
      # (504, then a read timeout), killing the build at its second second.
      # Fetch the archive with curl instead — real retries, several mirrors —
      # and point the wrapper at the local copy.
      - name: Cache the Gradle distribution
        uses: actions/cache@v4
        with:
          path: ~/.gradle/dist
          key: gradle-dist-${{ hashFiles('package-lock.json') }}

      - name: Fetch the Gradle distribution
        working-directory: android
        run: |
          set -euo pipefail
          props=gradle/wrapper/gradle-wrapper.properties
          url=$(sed -n 's/^distributionUrl=//p' "$props" | sed 's/\\//g')
          zip=$(basename "$url")
          dest="$HOME/.gradle/dist/$zip"
          mkdir -p "$HOME/.gradle/dist"

          if [ ! -s "$dest" ]; then
            version=${zip#gradle-}; version=${version%-*.zip}
            for mirror in \
              "$url" \
              "https://downloads.gradle.org/distributions/$zip" \
              "https://github.com/gradle/gradle-distributions/releases/download/v$version/$zip"
            do
              echo "Trying $mirror"
              if curl -fSL --retry 5 --retry-all-errors --retry-delay 10 \
                      --connect-timeout 30 --max-time 900 -o "$dest.part" "$mirror"; then
                mv "$dest.part" "$dest"
                break
              fi
              rm -f "$dest.part"
            done
          fi

          # An HTML error page would also be "downloaded", so check it unzips.
          unzip -tq "$dest"

          # file:// has no timeout and cannot fail halfway. Properties files
          # escape the colon, as the committed https URL already does.
          sed -i "s|^distributionUrl=.*|distributionUrl=file\\\\://$dest|" "$props"
          grep distributionUrl "$props"

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: enphase-clarity-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14

      # The APK above is uploaded first, so it stays downloadable even if the
      # device check below fails — the run still turns red.
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Smoke test on an Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash scripts/android-smoke.sh android/app/build/outputs/apk/release/app-release.apk
